[project]
name = "telemetry-anomaly-detection-demo"
version = "0.2.0"
description = "Synthetic telemetry anomaly detection and review demo"
requires-python = ">=3.10"
authors = [
  {name = "Charles Lucas"},
]
dependencies = [
  "streamlit>=1.60,<2",
]

[project.scripts]
telemetry-anomaly = "telemetry_anomaly_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
